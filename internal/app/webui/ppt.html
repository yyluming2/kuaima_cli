<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<title>快马 AI PPT 工作台</title>
<link rel="stylesheet" href="/app.css">
<link rel="stylesheet" href="/ppt.css">
<script src="/lucide.1.2.1.min.js" defer></script>
<script src="/react.production.min.js"></script>
<script src="/react-dom.production.min.js"></script>

<body>
  <div class="ppt-ai-entry"><button id="pptAiOpen" class="ppt-ai-button">✦ AI 制作 PPT</button></div>
  <div id="pptAiModal" class="ppt-ai-modal" hidden>
    <div class="ppt-ai-dialog">
      <div class="ppt-ai-head">
        <div>
          <h2>AI 制作 PPT</h2>
          <p>先确认内容大纲和视觉风格，再开始生成</p>
        </div><button id="pptAiClose" class="ppt-ai-close">×</button>
      </div>
      <div id="pptAiForm">
        <label>主题<input id="pptAiTitle" placeholder="例如：2026 年产品发布会"></label>
        <label>内容要求<textarea id="pptAiBrief" rows="4" placeholder="告诉 AI 你想讲什么、面向谁、有哪些重点"></textarea></label>
        <div class="ppt-ai-grid"><label>页数（3–50）<input id="pptAiPages" type="number" min="3" max="50" value="5"
              placeholder="例如：8"></label><label>视觉风格<input id="pptAiStyle" value="现代商务"
              placeholder="例如：科技感、极简留白"></label></div>
        <label>大纲生成模型<select id="pptAiTextModel">
            <option value="">正在加载模型…</option>
          </select><small id="pptAiTextModelHint">可选择用于生成大纲的文本模型</small></label>
        <div class="ppt-ai-grid"><label class="ppt-file">上传参考图片<input id="pptAiImages" type="file" accept="image/*"
              multiple><small id="pptAiImageHint">可多选</small></label><label class="ppt-file">使用参考 PPT<input
              id="pptAiDeck" type="file" accept=".pptx,.json"><small id="pptAiDeckHint">可选</small></label></div>
        <div class="ppt-ai-actions"><button id="pptAiPlan" class="ppt-ai-primary">生成大纲</button><button
            id="pptAiCancel">取消</button></div>
      </div>
      <div id="pptAiOutline" hidden>
        <h3>请确认生成方案</h3>
        <div id="pptAiOutlineList"></div>
        <div class="ppt-ai-actions"><button id="pptAiBack">返回修改</button><button id="pptAiGenerate"
            class="ppt-ai-primary">确认并生成 PPT</button></div>
      </div>
    </div>
  </div>
  <div id="app"></div>
  <script src="/app-icons.js"></script>
  <script src="/ppt.js"></script>
  <script src="/ppt-ai.js"></script>
</body>

</html>
