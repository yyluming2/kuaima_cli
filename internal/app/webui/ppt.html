<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<title>快马 AI PPT 工作台</title>
<link rel="stylesheet" href="/app.css">
<link rel="stylesheet" href="/ppt.css">
<script src="/lucide.1.2.1.min.js" defer></script>
<script src="/react.production.min.js"></script>
<script src="/react-dom.production.min.js"></script>

<body>
  <div class="ppt-ai-entry"><button id="pptAiOpen" class="ppt-ai-button">✦ AI 制作 PPT</button></div>
  <div id="pptAiModal" class="ppt-ai-modal" hidden>
    <div class="ppt-ai-dialog">
      <div class="ppt-ai-head">
        <div>
          <h2>AI 制作 PPT</h2>
          <p>先生成母版图，再确认大纲，最后生成每页完整画面</p>
        </div><button id="pptAiClose" class="ppt-ai-close">×</button>
      </div>
      <div id="pptAiForm">
        <input id="pptAiTitle" type="hidden" value="未命名主题">
        <label>主题和内容要求<textarea id="pptAiBrief" rows="4" placeholder="例如：2026 年产品发布会，面向企业客户，介绍新产品、核心优势、案例和行动计划"></textarea></label>
        <label>统一提示词（AI 生成，可修改）<textarea id="pptAiUnifiedPrompt" rows="2" placeholder="点击生成后由 AI 提供建议"></textarea></label>
        <label>大纲提示词（AI 生成，可修改）<textarea id="pptAiOutlinePrompt" rows="2" placeholder="点击生成后由 AI 提供建议"></textarea></label>
        <div class="ppt-ai-grid"><label>页数（3–50）<input id="pptAiPages" type="number" min="3" max="50" value="5"
              placeholder="例如：8"></label><label>视觉风格<input id="pptAiStyle" value="现代商务"
              placeholder="例如：科技感、极简留白"></label></div>
        <label>大纲生成模型<select id="pptAiTextModel">
            <option value="">正在加载模型…</option>
          </select><small id="pptAiTextModelHint">可选择用于生成大纲的文本模型</small></label>
        <label>图片生成模型<select id="pptAiImageModel"><option value="">正在加载模型…</option></select><small>用于母版图和每页画面</small></label>
        <div class="ppt-ai-grid"><label>参考主色<input id="pptAiAccent" type="color" value="#2563eb"></label><label>参考背景色<input id="pptAiBackground" type="color" value="#ffffff"></label></div>
        <label class="ppt-file">参考母版（可上传，也可由 AI 生成）<input id="pptAiMasterImage" type="file" accept="image/*"><small id="pptAiMasterHint">未选择，将由 AI 生成</small></label>
        <div class="ppt-ai-actions"><button id="pptAiPlan" class="ppt-ai-primary">生成提示词和母版</button><button
            id="pptAiCancel">取消</button></div>
      </div>
      <div id="pptAiOutline" hidden>
        <h3>第二步：编辑并确认大纲</h3>
        <p class="ppt-ai-help">有参考 PPT 时可直接使用其内容，不再调用 AI 生成大纲；没有则由 AI 生成。标题和要点都可以直接修改。</p>
        <label class="ppt-file">参考 PPT（可选）<input id="pptAiDeck" type="file" accept=".pptx,.json"><small id="pptAiDeckHint">没有参考 PPT 时使用 AI 大纲</small></label>
        <div id="pptAiOutlineList"></div>
        <div class="ppt-ai-actions"><button id="pptAiStyleNext" class="ppt-ai-primary">下一步：生成大纲</button></div>
      </div>
      <div id="pptAiStyleStep" hidden>
        <h3>第一步：确认母版图片</h3>
        <p class="ppt-ai-help">这张图片决定所有页面的统一视觉风格。满意后进入大纲确认。</p>
        <label class="check"><input id="pptAiUnified" type="checkbox" checked>所有页面统一背景模板</label>
        <label class="ppt-file">上传风格参考图（可选）<input id="pptAiStyleImage" type="file" accept="image/*"><small id="pptAiStyleHint">未选择</small></label>
        <div id="pptAiSample" class="ppt-ai-sample"><div class="sample-kicker">MASTER IMAGE</div><div class="sample-title">正在生成视觉母版…</div><div class="sample-line"></div><div class="sample-body">确认后将用于生成每一页完整图片</div></div>
        <div class="ppt-ai-actions"><button id="pptAiStyleBack">返回主题</button><button id="pptAiRegenerate" type="button">重新生成母版</button><button id="pptAiGenerate" class="ppt-ai-primary">确认母版，进入大纲</button></div>
      </div>
      <div id="pptAiProgress" class="ppt-ai-progress" hidden><div class="ppt-ai-progress-title">AI 正在工作…</div><div class="ppt-ai-progress-track"><i></i></div><div id="pptAiProgressText">正在连接模型</div><pre id="pptAiStreamText"></pre></div>
    </div>
  </div>
  <div class="ppt-toolbar-actions"><button id="pptMasterMode" type="button">进入母版画布</button></div>
  <div id="app"></div>
  <script src="/app-icons.js"></script>
  <script src="/ppt-core.js"></script>
  <script src="/ppt-inspector.js"></script>
  <script src="/ppt.js"></script>
  <script src="/ppt-ai.js"></script>
</body>

</html>
